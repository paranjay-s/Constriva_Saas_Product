[project]
name = "archplan-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.43.124",
    "celery[redis]>=5.6.3",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pymupdf>=2.1",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "reportlab>=5.1.0",
    "scikit-image>=0.26.0",
    "shapely>=2.2.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "sse-starlette>=3.6.0",
    "supabase>=2.34.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.5",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
