<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset library</title>
<link rel="stylesheet" href="style.css?v=2">
<style>
  .lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .lib figure { margin: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); color: var(--ink); }
  .lib img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #eee; }
  .lib figcaption { padding: 10px 12px; font-size: 14px; display: grid; gap: 6px; }
  .lib .tag { font-size: 12px; padding: 1px 7px; border-radius: 9px; justify-self: start; border: 1px solid currentColor; }
  .lib .unreviewed { color: var(--accent); } .lib .approved, .lib .team-made { color: var(--ok); } .lib .rejected { color: var(--bad); }
  .lib .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .lib details { font-size: 12px; color: var(--muted); }
</style>
</head>
<body class="home">
<main class="wrap" style="max-width:1100px">
  <p class="brand"><a href="../" style="color:inherit;text-decoration:none">PlanTo3D</a> · <a href="../">Home</a></p>
  <h1>Asset library</h1>
  <p class="muted">Room kits and pieces the houses are furnished from. Assets made by the creator agent start as
    <b>unreviewed</b> and are used only after you approve them (or with PLAN3D_USE_UNREVIEWED). Approving and
    rejecting works only when the service runs in developer mode.</p>
  <p><label><input type="checkbox" id="only"> Only unreviewed</label></p>
  <p id="state" class="muted" role="status"></p>
  <div class="lib" id="list"></div>
</main>
<script>
const list = document.getElementById("list"), state = document.getElementById("state"), only = document.getElementById("only");
let entries = [];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// builds use team-made pieces unless rejected; AI-made ones only once approved (gen.py)
function status(e) {
  if (e.review === "approved" || e.review === "rejected") return e.review;
  return String(e.source || "").startsWith("team-made") ? "team-made" : "unreviewed";
}
function draw() {
  const shown = entries.filter((e) => !only.checked || status(e) === "unreviewed");
  state.textContent = `${shown.length} of ${entries.length} assets`;
  list.innerHTML = shown.map((e) => {
    const st = status(e), size = (e.size_m || []).map((v) => v.toFixed(2)).join(" × ");
    const tris = typeof e.tris === "object" ? `${e.tris.browser} browser / ${e.tris.detailed} detailed` : (e.tris ?? "");
    return `<figure>
      <img loading="lazy" alt="${esc(e.id)}" src="/library/${esc(e.preview)}">
      <figcaption>
        <b>${esc(e.id)}</b>
        <span class="tag ${st}">${st}</span>
        <span class="muted">${esc(e.kind)} · ${size} m · ${esc(tris)} triangles</span>
        <span class="muted">${esc(e.source)} · ${esc(e.licence)}${e.cost_usd != null ? ` · $${e.cost_usd}` : ""}</span>
        ${e.prompt ? `<details><summary>Prompt</summary>${esc(e.prompt)}</details>` : ""}
        <div class="row">
          <button data-id="${esc(e.id)}" data-r="approved">Approve</button>
          <button data-id="${esc(e.id)}" data-r="rejected">Reject</button>
        </div>
      </figcaption></figure>`;
  }).join("");
}
async function load() {
  const r = await fetch("/api/library");
  entries = (await r.json()).entries || [];
  draw();
}
list.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  const e = entries.find((x) => x.id === b.dataset.id), dir = String(e?.preview || "").split("/")[0];
  const r = await fetch(`/api/library/${dir}/${b.dataset.id}/review`, { method: "POST", body: JSON.stringify({ review: b.dataset.r }) });
  state.textContent = r.ok ? `${b.dataset.id}: ${b.dataset.r}` : "Only in developer mode (run_planto3d.sh --dev).";
  if (r.ok) load();
});
only.addEventListener("change", draw);
load();
</script>
</body>
</html>
